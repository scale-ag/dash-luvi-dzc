name: TMP inspect sales columns
on:
  push:
    branches: [ "claude/relaxed-mccarthy-3z4xqr" ]
    paths: [ ".github/workflows/tmp-inspect-sales.yml" ]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect (sem PII)
        run: |
          curl -sSL -o meta.csv "https://docs.google.com/spreadsheets/d/1AJC2FZNqc-KL5TiUy5scEFHt6FS_3mJdQplVBagPhiI/export?format=csv&gid=0"
          curl -sSL -o sales.csv "https://docs.google.com/spreadsheets/d/1fVmJpiS1ubQIc2-wezzB9PkJnjs3agmeeC-0dlpcaVY/export?format=csv&gid=1010133128"
          python3 - <<'PY'
          import csv, collections, re
          m = list(csv.reader(open('meta.csv', encoding='utf-8', errors='replace')))
          s = list(csv.reader(open('sales.csv', encoding='utf-8', errors='replace')))
          print("SALES_ROWS", len(s) - 1)
          h = s[0]
          print("SALES_HEADER", h)
          ads = {r[3].strip().lower() for r in m[1:] if len(r) > 3}
          camps = {r[1].strip().lower() for r in m[1:] if len(r) > 1}
          pii = re.compile(r'(nome|name|mail|telefone|phone|cpf|documento|endere|address|whats|celular)', re.I)
          for i, col in enumerate(h):
              vals = [r[i].strip() for r in s[1:] if i < len(r)]
              filled = sum(1 for v in vals if v)
              if pii.search(col):
                  print(f"COL[{i}] {col!r} filled={filled} (PII, omitido)")
                  continue
              c = collections.Counter(vals).most_common(6)
              hits_ad = sum(1 for v in vals if v and v.lower() in ads)
              hits_c = sum(1 for v in vals if v and v.lower() in camps)
              print(f"COL[{i}] {col!r} filled={filled} distinct={len(set(vals))} match_adname={hits_ad} match_campaign={hits_c} top={c}")
          PY
